title: Scheduled Task Created via Schtasks.exe (Possible Persistence)
id: cacfdd54-23f1-4901-ba50-726008392332
status: experimental
description: Detects schtasks.exe being run with the /create flag, a common way to establish persistence.
author: Eduardo Fogaça
date: 2026-10-18
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_cli:
        CommandLine|contains:
            - '/create'
            - '-create'
    condition: all of selection_*
falsepositives:
    - Software installers and updaters
    - Legitimate administrative scripts
level: medium
